<html lang="en">
<head>
<meta charset="utf-8">

<body data-route="today">

  <a href="#/today" data-route="today"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"/></svg>Today</a>
  <a href="#/overview" data-route="overview"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V13M12 20V5M19 20v-9"/></svg>Progress</a>
  <a href="#/plan" data-route="plan"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.6" cy="6.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.6" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.6" cy="17.5" r="1.3" fill="currentColor" stroke="none"/></svg>Plan</a>

</nav>
<dialog id="sheet" class="sheet" aria-label="Details"><div class="grip" aria-hidden="true"></div><div id="sheetBody"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript>PADEL OS needs JavaScript.</noscript>
<script type="module" src="main.js"></script>
<script>
// Safety net: if the app hasn't drawn anything after 6 s (for example a half-finished update),
// offer a clean reload that clears the offline copy. Your data is not touched.
setTimeout(function () {
  var app = document.getElementById('app');
  if (!app || app.children.length) return;
  app.innerHTML = '<div style="padding:48px 24px;text-align:center;font:17px -apple-system,system-ui,sans-serif"><p style="margin-bottom:16px">The app didn’t load properly.</p><button id="hardReload" style="font:inherit;padding:12px 20px;border-radius:12px;border:0;background:#0A84FF;color:#fff">Reload</button><p style="margin-top:12px;color:#8E8E93;font-size:14px">Your workouts are safe.</p></div>';
  document.getElementById('hardReload').onclick = function () {
    Promise.resolve(window.caches ? caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }) : 0)
      .then(function () { return navigator.serviceWorker ? navigator.serviceWorker.getRegistrations() : []; })
      .then(function (r) { return Promise.all(r.map(function (x) { return x.update(); })); })
      .finally(function () { location.reload(); });
  };
}, 6000);
</script>
</body>
</html>
