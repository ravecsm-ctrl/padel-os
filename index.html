<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07110f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PADEL OS">
<meta name="description" content="Private, offline padel strength & conditioning tracker with smart progression.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
<title>PADEL OS</title>
</head>
<body data-route="today">
<header class="topbar">
  <a href="#/today" class="brand" aria-label="PADEL OS home"><span class="eyebrow">PERSONAL PERFORMANCE</span><h1>PADEL <b>OS</b></h1></a>
  <button id="weekBtn" class="week-pill" aria-label="Program week — open plan"></button>
</header>
<main id="app" tabindex="-1"></main>
<div id="restbar" class="restbar" hidden role="timer" aria-live="off"></div>
<nav class="tabbar" aria-label="Primary">
  <a href="#/today" data-route="today"><span aria-hidden="true">◉</span>Today</a>
  <a href="#/plan" data-route="plan"><span aria-hidden="true">▦</span>Plan</a>
  <a href="#/history" data-route="history"><span aria-hidden="true">↗</span>History</a>
  <a href="#/settings" data-route="settings"><span aria-hidden="true">⚙</span>Settings</a>
</nav>
<dialog id="sheet" class="sheet" aria-label="Details"><div class="grip" aria-hidden="true"></div><div id="sheetBody"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript>PADEL OS needs JavaScript.</noscript>
<script type="module" src="main.js"></script>
</body>
</html>
